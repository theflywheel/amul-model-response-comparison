version: "3.9"

services:
  frontend:
    build: .
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - VITE_LOGGER_URL=${VITE_LOGGER_URL:-http://localhost:4000}
      - VITE_ADMIN_TOKEN=${ADMIN_TOKEN:-changeme}
    depends_on:
      - logger

  logger:
    build: .
    command: sh -c "mkdir -p /app/data && node log-server.mjs"
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - ADMIN_TOKEN=${ADMIN_TOKEN:-changeme}
    volumes:
      - ./data:/app/data

